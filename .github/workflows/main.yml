name: Generate Project Documentation

on:
  push:
    branches:
      - backend

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- SECTION 1: DATABASE DOCS (SchemaSpy) ---
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Run SchemaSpy
        working-directory: API/database/schema_doc
        run: java -jar schemaspy.jar -configFile schemaspy.properties

      # --- SECTION 2: API DOCS (Go / Swagger) ---
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: API/go.sum

      - name: Install Swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger Docs
        working-directory: API
        run: |
          go mod download
          # We use -g to point to the main file and --parseInternal to pick up your subfolders
          $(go env GOPATH)/bin/swag init -g cmd/main.go -o docs --parseDependency --parseInternal --parseVendor

      # --- SECTION 3: MERGE FOR DEPLOYMENT ---
      - name: Prepare Deployment Folder
        run: |
          mkdir -p staging-site
          mkdir -p staging-site/database

          # 1. Copy Swagger API Docs
          # We check if the files exist first to prevent "No such file" errors
          cp API/docs/swagger.json staging-site/ || echo "swagger.json missing"
          cp API/docs/swagger.yaml staging-site/ || echo "swagger.yaml missing"
          
          # 2. Rename your custom swagger.html to index.html at the root
          cp API/docs/swagger.html staging-site/index.html || echo "swagger.html missing"

          # 3. Copy Database Docs to /database subfolder
          cp -r API/database/schema_doc/output/* staging-site/database/

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4