name: Generate Project Documentation

on:
  push:
    branches:
      - backend

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- SECTION 1: DATABASE DOCS (SchemaSpy) ---
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Run SchemaSpy
        working-directory: API/database/schema_doc
        run: java -jar schemaspy.jar -configFile schemaspy.properties

      # --- SECTION 2: API DOCS (Swagger) ---
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger Docs
        run: |
          # Use your exact command here
          ~/go/bin/swag init --dir ./API/cmd,./API/handlers,./API/models,./API/utils --output ./API/docs --generalInfo ./API/cmd/main.go --parseDependency --parseVendor

      # --- SECTION 3: MERGE FOR DEPLOYMENT ---
      - name: Prepare Deployment Folder
        run: |
          mkdir -p deployment-folder
          # Copy DB docs to /database subfolder
          cp -r API/database/schema_doc/output ./deployment-folder/database
          # Copy Swagger docs (json, yaml, and our html) to root
          cp API/docs/swagger.json ./deployment-folder/
          cp API/docs/swagger.yaml ./deployment-folder/
          cp API/docs/swagger.html ./deployment-folder/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deployment-folder

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
