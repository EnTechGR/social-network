name: Generate Project Documentation

on:
  push:
    branches:
      - backend

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- SECTION 1: DATABASE DOCS (SchemaSpy) ---
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Run SchemaSpy
        working-directory: API/database/schema_doc
        run: java -jar schemaspy.jar -configFile schemaspy.properties

      # --- SECTION 2: API DOCS (Go / Swagger) ---
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          # This tells Go where your go.sum is!
          cache-dependency-path: API/go.sum

      - name: Install Swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger Docs
        working-directory: API
        run: |
          # 1. Ensure dependencies are present for swag to parse correctly
          go mod download
          # 2. Run swag from inside the API folder so paths are relative to go.mod
          $(go env GOPATH)/bin/swag init --dir ./cmd,./handlers,./models,./utils --output ./docs --generalInfo ./cmd/main.go --parseDependency --parseVendor

      # --- SECTION 3: MERGE FOR DEPLOYMENT ---
      - name: Prepare Deployment Folder
        run: |
          mkdir -p staging-site
          mkdir -p staging-site/database

          # Copy API Docs (Swagger) to root
          cp API/docs/swagger.json staging-site/
          cp API/docs/swagger.yaml staging-site/
          # Ensure you have created this API/docs/swagger.html file in your repo!
          cp API/docs/swagger.html staging-site/index.html

          # Copy Database Docs to /database subfolder
          cp -r API/database/schema_doc/output/* staging-site/database/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./staging-site

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4