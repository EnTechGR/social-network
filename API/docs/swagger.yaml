basePath: /forum/api
definitions:
  models.ErrorResponse:
    properties:
      code:
        description: |-
          The HTTP status code of the response.
          example: 400
        type: integer
      error:
        description: |-
          The standard HTTP status text for the code.
          example: Bad Request
        type: string
      message:
        description: |-
          A user-friendly message describing the specific issue.
          example: Invalid request body or validation failed.
        type: string
    type: object
  models.LoginResponse:
    properties:
      csrf_token:
        description: |-
          The CSRF token required for subsequent protected POST/PUT/DELETE requests.
          example: XyZ123AbC456DeF789GhI0JkL
        type: string
      session_id:
        description: |-
          The session ID (often set as a cookie, but included here for context).
          example: d2e9f8a7-b6c5-d4e3-f2a1-b0c9d8e7f6a5
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: The details of the successfully logged-in user.
    type: object
  models.User:
    properties:
      age:
        description: |-
          The age of the user.
          example: 35
        type: integer
      created_at:
        description: |-
          The timestamp when the user account was created.
          example: 2025-01-01T10:00:00Z
        type: string
      email:
        description: |-
          The email address of the user.
          example: john.doe@example.com
        type: string
      first_name:
        description: |-
          The first name of the user.
          example: John
        type: string
      gender:
        description: |-
          The gender of the user (e.g., Male, Female, Other).
          example: Male
        type: string
      id:
        description: |-
          The unique identifier for the user.
          example: 7b1a2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        type: string
      last_name:
        description: |-
          The last name of the user.
          example: Doe
        type: string
      username:
        description: |-
          The unique username of the user.
          example: johndoe
        type: string
    type: object
  models.UserLogin:
    properties:
      login:
        description: |-
          The user's username OR email address.
          required: true
          example: johndoe OR john.doe@example.com
        type: string
      password:
        description: |-
          The user's password.
          required: true
          example: secureP@ss123
        type: string
    type: object
  models.UserRegistration:
    properties:
      age:
        description: |-
          The user's age. Must be between 13 and 120.
          required: true
          minimum: 13
          maximum: 120
          example: 24
        type: integer
      email:
        description: |-
          The user's email address. Must be unique and valid.
          required: true
          example: register@example.com
        type: string
      first_name:
        description: |-
          The user's first name.
          required: true
          example: Jane
        type: string
      gender:
        description: |-
          The user's gender.
          required: true
          example: Female
        type: string
      last_name:
        description: |-
          The user's last name.
          required: true
          example: Smith
        type: string
      password:
        description: |-
          The user's chosen password.
          required: true
          min length: 8
          example: secureP@ss123
        type: string
      username:
        description: |-
          The desired unique username.
          required: true
          min length: 4
          example: new_forum_user
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API documentation for the forum application.
  title: Forum Application API
  version: "1.0"
paths:
  /forum/api/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account, validates input fields, and establishes
        a session cookie.
      parameters:
      - description: User registration details
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.UserRegistration'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully registered and logged in.
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: Invalid request body or validation failed (e.g., weak password,
            invalid age).
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: 'Conflict: Username or email is already taken.'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
  /forum/api/session/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using either username or email and password,
        then creates a session cookie.
      parameters:
      - description: User login credentials
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: User successfully logged in.
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: Invalid request body or missing credentials.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 'Unauthorized: Invalid username/email or password.'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Log in a user
      tags:
      - Authentication
  /forum/api/session/logout:
    post:
      description: Deletes the current user session from the database and clears the
        session and CSRF cookies.
      produces:
      - text/plain
      responses:
        "200":
          description: Successfully logged out (session cookie cleared).
      summary: Log out a user
      tags:
      - Authentication
  /forum/api/session/logout-all:
    post:
      description: Deletes all active sessions for the currently authenticated user
        and clears the current session cookie.
      produces:
      - text/plain
      responses:
        "200":
          description: Successfully logged out from all devices.
        "401":
          description: 'Unauthorized: User not authenticated.'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Log out from all devices
      tags:
      - Authentication
  /forum/api/session/verify:
    get:
      description: Checks if the session cookie is valid, active, and not expired.
        Returns user data if session is valid.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              csrf_token:
                type: string
              user:
                $ref: '#/definitions/models.User'
            type: object
        "401":
          description: 'Unauthorized: Session cookie not found, invalid, or expired.'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Verify current session status
      tags:
      - Authentication
  /forum/api/user/profile:
    get:
      description: Returns the profile data for the user associated with the active
        session.
      produces:
      - application/json
      responses:
        "200":
          description: Successful response.
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: 'Unauthorized: User not authenticated.'
      summary: Get current user profile
      tags:
      - User Profile
swagger: "2.0"
